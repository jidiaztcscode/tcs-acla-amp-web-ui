<div class="page-layout">
  <div class="page-content">
    <!-- Header con título y botones -->
    <div class="header-container">
      <app-title>Consultar perfil de usuarios</app-title>

      <div class="button-wrapper">
        <app-add-button class="btn-agregar" (click)="onAgregar()"></app-add-button>
        <app-download-report-button
          class="btn-descargar"
          (click)="onDescargar()"
        ></app-download-report-button>
      </div>
    </div>

    <app-tables [data]="data"></app-tables>
  </div>
</div>
