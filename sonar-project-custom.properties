sonar.projectName: ${env.SONAR_CLOUD_PROJECT_NAME}
sonar.login: ${env.SONAR_CLOUD_TOKEN}
sonar.organization: ${env.SONAR_CLOUD_ORG}
sonar.projectKey: ${env.SONAR_CLOUD_PROJECT_KEY}
sonar.branch.name: ${env.CURRENT_BRANCH}
sonar.projectVersion=1.0
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.javascript.tslint.configPath=.eslintrc.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts, **/*.spec.tsx,  **/*.e2e.ts, **/assets/** , **/**/main.ts, **/*/bootstrap.ts, **/environments/*
sonar.exclusions=**/node_modules/**, **/*.spec.ts, **/*.spec.tsx,  **/*.e2e.ts, **/assets/** , **/**/main.ts, **/bootstrap.ts, **/environments/*
